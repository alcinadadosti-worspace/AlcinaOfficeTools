name: Instaladores

# Gera o instalador único do Alcina Office (Windows .exe + Linux AppImage/.deb).
# Um só aplicativo contém a Central e todas as ferramentas (Planilhas, Documentos,
# Apresentações, Notas e Analytics), cada uma abrindo em sua própria janela.
# Dispara manualmente (workflow_dispatch) ou ao publicar uma tag "v*".
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Necessário para o passo que cria/atualiza os Releases (canal de auto-update).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        app: [office]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências (workspace)
        run: npm ci

      - name: Gerar instaladores do app
        working-directory: apps/${{ matrix.app }}
        run: npm run dist

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            apps/${{ matrix.app }}/release/*.exe
            apps/${{ matrix.app }}/release/*.zip
            apps/${{ matrix.app }}/release/*.AppImage
            apps/${{ matrix.app }}/release/*.deb
            apps/${{ matrix.app }}/release/*.yml
            apps/${{ matrix.app }}/release/*.blockmap

      # Canal de auto-update: envia os instaladores + latest*.yml + .blockmap para um
      # Release "rolante" por app (tag = nome do app). O electron-updater lê o latest.yml
      # direto da URL de download do Release. Idempotente (cria se faltar, sobrescreve assets).
      - name: Publicar no Release de atualização
        working-directory: apps/${{ matrix.app }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ matrix.app }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Alcina Office — instalador e atualizações" \
            --notes "Instalador único do Alcina Office (Central + todas as ferramentas). Assets atualizados automaticamente pelo CI — não editar manualmente." \
            --latest=true || true
          shopt -s nullglob
          files=(release/*.exe release/*.exe.blockmap release/*.zip release/*.yml release/*.AppImage release/*.deb)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Nenhum artefato para publicar em $tag"
          fi
