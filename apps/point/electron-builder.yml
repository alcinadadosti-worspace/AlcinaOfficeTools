appId: com.alcina.point
productName: "Alcina Office — Apresentações"
executableName: alcina-point
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: AlcinaOffice-Apresentacoes-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Alcina Dados TI
  artifactName: AlcinaOffice-Apresentacoes-${version}-linux-${arch}.${ext}
publish:
  provider: generic
  url: https://alcina-office-updates.onrender.com/point
