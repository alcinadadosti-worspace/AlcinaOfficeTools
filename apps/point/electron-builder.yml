appId: com.alcina.point
productName: AlcinaPoint
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Alcina Dados TI
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: generic
  url: https://alcina-office-updates.onrender.com/point
