appId: com.alcina.bi
productName: "Alcina Office — Analytics"
executableName: alcina-bi
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: AlcinaOffice-Analytics-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Alcina Dados TI
  artifactName: AlcinaOffice-Analytics-${version}-linux-${arch}.${ext}
publish:
  provider: generic
  url: https://github.com/alcinadadosti-worspace/AlcinaOfficeTools/releases/download/bi
