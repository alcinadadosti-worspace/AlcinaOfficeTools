appId: com.alcina.office
productName: Alcina Office
executableName: alcina-office
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Associações de arquivo: o app passa a aparecer no "Abrir com" do Windows para estes tipos
# (e abre no Planilhas). Registrado pelo instalador NSIS.
fileAssociations:
  - ext: alcsheet
    name: Planilha do Alcina Office
    description: Planilha do Alcina Office
    role: Editor
  - ext: xlsx
    name: Pasta de trabalho do Excel
    description: Planilha
    role: Editor
  - ext: xlsm
    name: Pasta de trabalho do Excel com macros
    role: Editor
  - ext: xls
    name: Planilha do Excel 97-2003
    role: Editor
  - ext: csv
    name: Valores separados por vírgula
    role: Editor
  - ext: ods
    name: Planilha OpenDocument
    role: Editor
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
  artifactName: AlcinaOffice-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Alcina Office
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Alcina Dados TI
  artifactName: AlcinaOffice-${version}-linux-${arch}.${ext}
publish:
  provider: generic
  url: https://github.com/alcinadadosti-worspace/AlcinaOfficeTools/releases/download/office
